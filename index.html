<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>momo購物網 - 系統忙碌中</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff5f9;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      color: #333;
      padding: 20px;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 8px 30px rgba(236, 0, 140, 0.15);
    }

    .logo {
      background: #ec008c;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      padding: 14px;
      letter-spacing: 2px;
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .content {
      padding: 28px 24px 32px;
    }

    h1 {
      font-size: 24px;
      color: #ec008c;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">momo購物網</div>
    <img src="images.jpg" alt="睡著的小猴子抱著玩偶">
    <div class="content">
      <h1>系統忙碌中</h1>
      <p>目前人數太多，小猴子睡著了。<br>請稍後再試，謝謝您的耐心等候。</p>
    </div>
  </div>
</body>
</html>
